name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See the security policy instead.
        Never include credentials or sensitive information.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the minimal steps needed to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, tool and runtime versions, and any other relevant details.
    validations:
      required: true
